[project]
name = "langgraph-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bibin Ambro", email = "bibinambro011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
]

[project.scripts]
langgraph-tutorial = "langgraph_tutorial:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
